# These are the flows Maestro runs. Helpers live in subflows/ and are tagged
# "util" so they are not started on their own.
flows:
  - show-hide-password.yaml
  - driver.yaml
  - contractor.yaml
  - trucking-company.yaml
  - foreman.yaml
excludeTags:
  - util
# Default order is non-deterministic. These flows are independent, so keep
# going after a failure and always run them in this order.
executionOrder:
  continueOnFailure: true
  flowsOrder:
    - show-hide-password
    - driver
    - contractor
    - trucking-company
    - foreman
