appId: com.loadlink.app
name: foreman
---
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      MAESTRO_EMAIL: ${MAESTRO_FOREMAN_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_FOREMAN_PASSWORD}
- runFlow:
    file: subflows/assert-role.yaml
    env:
      ROLE_LABEL: "FOREMAN"
