appId: com.loadlink.app
name: driver-home
---
- runFlow:
    file: subflows/ensure-session.yaml
    env:
      MAESTRO_EMAIL: ${MAESTRO_DRIVER_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_DRIVER_PASSWORD}
- runFlow:
    file: subflows/feature-home.yaml
    env:
      LOADS_LABEL: "FIND LOADS"
      CALENDAR_TITLE: "FLEET MANAGER"
