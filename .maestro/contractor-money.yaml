appId: com.loadlink.app
name: contractor-money
---
- runFlow:
    file: subflows/ensure-session.yaml
    env:
      MAESTRO_EMAIL: ${MAESTRO_CONTRACTOR_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_CONTRACTOR_PASSWORD}
- runFlow:
    file: subflows/feature-money.yaml
    env:
      EXPECT_INVOICES: "yes"
