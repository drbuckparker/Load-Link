appId: com.loadlink.app
tags:
  - util
---
# Caller passes MAESTRO_EMAIL and MAESTRO_PASSWORD. Nothing here is a real password.
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 120000
- tapOn:
    id: login-email-input
- inputText: "${MAESTRO_EMAIL}"
- tapOn:
    id: login-password-input
- inputText: "${MAESTRO_PASSWORD}"
# Tapping the title dismisses the keyboard. hideKeyboard fails on the
# emulator when the keyboard has no standard dismiss action.
- tapOn:
    text: "WELCOME BACK"
    optional: true
- tapOn:
    text: "SIGN IN"
- tapOn:
    text: Don't allow
    optional: true
- tapOn:
    text: While using the app
    optional: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    text: Don't allow
    optional: true
- tapOn:
    text: While using the app
    optional: true
