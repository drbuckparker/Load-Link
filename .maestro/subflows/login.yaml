appId: com.loadlink.app
tags:
  - util
---
# Caller passes MAESTRO_EMAIL and MAESTRO_PASSWORD. Nothing here is a real password.
- extendedWaitUntil:
    visible:
      id: login-screen
    timeout: 120000
- tapOn:
    id: login-email-input
- inputText: "${MAESTRO_EMAIL}"
# Dismiss the email keyboard before tapping the password field. Otherwise
# the password is typed into the email field and Sign In sees an empty password.
- tapOn:
    text: "WELCOME BACK"
- tapOn:
    id: login-password-input
- inputText: "${MAESTRO_PASSWORD}"
- tapOn:
    text: "WELCOME BACK"
- tapOn:
    text: "SIGN IN"
- tapOn:
    text: Don't allow
    optional: true
- tapOn:
    text: While using the app
    optional: true
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 120000
- tapOn:
    text: Don't allow
    optional: true
- tapOn:
    text: While using the app
    optional: true
