appId: com.loadlink.app
tags:
  - util
---
# Caller passes ROLE_LABEL, for example DRIVER or TRUCKING COMPANY.
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: profile-role-badge
    timeout: 20000
- assertVisible:
    id: profile-role-badge
    text: ${ROLE_LABEL}
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
