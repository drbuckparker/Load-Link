appId: com.loadlink.app
tags:
  - util
---
# Activity is the notifications list. Billing is the Billing tab in Settings.
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- tapOn:
    id: notifications-btn
- extendedWaitUntil:
    visible:
      id: notifications-screen
    timeout: 20000
- assertVisible: NOTIFICATIONS
- tapOn:
    id: notifications-back
- tapOn:
    id: tab-profile
- extendedWaitUntil:
    visible:
      id: settings-screen
    timeout: 20000
- tapOn:
    id: settings-tab-billing
- extendedWaitUntil:
    visible:
      id: billing-panel
    timeout: 15000
- assertVisible: "BILLING & SUBSCRIPTIONS"
