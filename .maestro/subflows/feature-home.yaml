appId: com.loadlink.app
tags:
  - util
---
# Caller passes LOADS_LABEL and CALENDAR_TITLE.
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
- assertVisible:
    id: find-loads-btn
- assertVisible: ${LOADS_LABEL}
- assertVisible:
    id: notifications-btn
- tapOn:
    id: tab-calendar
- extendedWaitUntil:
    visible:
      id: calendar-screen
    timeout: 20000
- assertVisible: ${CALENDAR_TITLE}
- tapOn:
    id: tab-home
- extendedWaitUntil:
    visible:
      id: dashboard-screen
    timeout: 20000
