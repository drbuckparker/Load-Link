appId: com.loadlink.app
name: show-hide-password
---
# The login screen is the same for every role. This checks the eye button
# with the driver account's password. It does not sign in.
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: deny
- extendedWaitUntil:
    visible:
      id: login-password-hidden
    timeout: 60000
- tapOn:
    id: login-password-input
- inputText: "${MAESTRO_DRIVER_PASSWORD}"
- assertVisible:
    id: login-password-hidden
- tapOn:
    id: login-password-hidden
- assertVisible:
    id: login-password-visible
- tapOn:
    id: login-password-visible
- assertVisible:
    id: login-password-hidden
