appId: com.loadlink.app
name: show-hide-password
---
# The login screen is the same for every role. This checks the eye button
# with the driver account's password. It does not sign in.
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: deny
- extendedWaitUntil:
    visible: "WELCOME BACK"
    timeout: 120000
- tapOn:
    id: login-password-input
- inputText: "${MAESTRO_DRIVER_PASSWORD}"
- assertVisible: "Show password"
- tapOn: "Show password"
- assertVisible: "Hide password"
- tapOn: "Hide password"
- assertVisible: "Show password"
