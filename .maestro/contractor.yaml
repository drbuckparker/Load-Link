appId: com.loadlink.app
name: contractor
---
- runFlow: subflows/launch-fresh.yaml
- runFlow:
    file: subflows/login.yaml
    env:
      MAESTRO_EMAIL: ${MAESTRO_CONTRACTOR_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_CONTRACTOR_PASSWORD}
- runFlow:
    file: subflows/assert-role.yaml
    env:
      ROLE_LABEL: "CONTRACTOR"
