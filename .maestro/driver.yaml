appId: com.loadlink.app
name: driver
---
- launchApp:
    clearState: true
    permissions:
      location: deny
      notifications: deny
- runFlow:
    file: subflows/login.yaml
    env:
      MAESTRO_EMAIL: ${MAESTRO_DRIVER_EMAIL}
      MAESTRO_PASSWORD: ${MAESTRO_DRIVER_PASSWORD}
- runFlow:
    file: subflows/assert-role.yaml
    env:
      ROLE_LABEL: DRIVER
- runFlow: subflows/open-messages.yaml
- runFlow:
    file: subflows/open-first-job.yaml
    env:
      LOADS_LABEL: FIND LOADS
- runFlow: subflows/accept-open-job.yaml
- runFlow: subflows/send-message.yaml
- runFlow:
    file: subflows/view-documents.yaml
    env:
      EXPECT_INVOICES: "no"
- runFlow: subflows/view-activity-billing.yaml
- runFlow: subflows/logout.yaml
