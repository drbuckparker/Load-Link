name: Android Play internal

on:
  workflow_dispatch:
  push:
    tags:
      - "android-v*"

jobs:
  internal:
    name: Build and submit to Play internal
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build Android and submit to the internal track
        run: eas build -p android --profile production --non-interactive --no-wait --auto-submit
