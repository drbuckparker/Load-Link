name: iOS TestFlight

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  testflight:
    name: Build and submit to TestFlight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build iOS and submit to TestFlight
        run: eas build -p ios --profile production --non-interactive --no-wait --auto-submit
